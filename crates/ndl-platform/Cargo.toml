[package]
name = "ndl-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Camada de abstração do NDL sobre o sistema operacional: janelas, eventos, input, cursor e monitores."

[dependencies]
# Handle de janela genérico e multiplataforma — ndl-platform nunca depende
# de ndl-render (ou de qualquer lib de renderização) diretamente. Expor um
# RawWindowHandle aqui permite que o jogo o entregue para ndl-render (ou
# qualquer outra lib gráfica) sem que as duas crates se conheçam.
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
winit = "0.30"
