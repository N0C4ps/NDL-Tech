[package]
name = "ndl-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Abstrações de renderização do ecossistema NDL sobre backends gráficos (Direct3D 11, depois outros)."

[features]
# O backend ativo é escolhido em tempo de compilação — exatamente um
# backend de API gráfica por build, nunca os dois ao mesmo tempo. Isso é
# o que permite `backend::ActiveBackend` (ver `src/backend/mod.rs`)
# resolver pra um tipo concreto sem `dyn`/vtable nenhum. Cada backend fica
# na sua própria pasta (`src/backend/d3d11`, `src/backend/d3d12`) — nem
# todo mundo tem D3D12 (ou precisa dele), então habilitar um nunca traz o
# código do outro. Reservado: "backend-vulkan".
default = ["backend-d3d11"]
backend-d3d11 = []
# D3D12: ainda cobre só o essencial (device/fila, buffers, pipeline
# gráfico, draw/draw_indexed, MRT, swapchain) — ver o `//!` de
# `backend::d3d12` pro que continua reservado (compute, queries, sync,
# debug markers, draw/dispatch indireto, generate_mips, mip chains e
# arrays de textura).
backend-d3d12 = []

[dependencies]
# Handle de janela genérico e multiplataforma — ndl-render nunca depende de
# ndl-platform (ou de qualquer outra lib de janela) diretamente; a conexão
# entre as duas é feita pelo código do jogo, que extrai um RawWindowHandle
# de onde quer que tenha a janela e entrega para ndl-render::surface.
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
    # Só para os testes de integração abrirem uma janela Win32 crua, sem
    # depender de ndl-platform — prova que ndl-render funciona com
    # qualquer handle de janela.
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
] }

[dev-dependencies]
# Só para os testes de integração montarem uma matriz de transform de
# verdade — ndl-render em si nunca depende de ndl-math (ou de qualquer
# outra crate do NDL): update_buffer recebe bytes crus, é o jogo (aqui, o
# teste) que decide o que esses bytes significam.
ndl-math = { path = "../ndl-math" }
